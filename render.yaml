# Render deployment configuration for mento.ai Backend
services:
  - type: web
    name: mento-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard (MongoDB Atlas connection string)
      - key: SESSION_SECRET
        generateValue: true  # Render auto-generates a secure 256-bit random string
      - key: TAVUS_API_KEY
        sync: false  # Set in Render dashboard
      - key: TAVUS_API_URL
        value: https://tavusapi.com/v2
      - key: TAVUS_REPLICA_ID
        value: r6ae5b6efc9d
      - key: TAVUS_DEFAULT_PERSONA_ID
        sync: false  # Optional